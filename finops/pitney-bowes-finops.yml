specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Pitney Bowes
providerId: pitney-bowes
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Shipping
  - Logistics
  - Mailing
notes: Pitney Bowes does not publish a self-service price book for its Shipping APIs. Cost is
  driven by negotiated merchant contracts plus pass-through postage / parcel rates. This artifact
  models the FinOps shape at the contract / shipment level; per-call API price is not publicly
  documented.
description: FOCUS-aligned FinOps placeholder for Pitney Bowes. The cost surface is dominated by
  pass-through carrier postage and parcel rates plus any negotiated platform fees. APIs are an
  entitlement of the merchant contract rather than a separately metered SKU.
sources:
  - https://www.pitneybowes.com/us/developer.html
  - https://docs.shippingapi.pitneybowes.com/api
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Pitney Bowes Inc.
serviceCategory: Shipping and Mailing
billingModel:
  pricingCategory: Pass-Through Postage + Contract
  billingFrequency: Per-Shipment / Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Pitney Bowes Shipping API
  ServiceCategory: Shipping and Mailing
  ServiceSubcategory: Parcel and Postage
  ProviderName: Pitney Bowes
  PublisherName: Pitney Bowes Inc.
  InvoiceIssuerName: Pitney Bowes Inc.
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: shipment
    description: Each label generated / parcel shipped through the Shipping API. Drives the
      pass-through carrier postage charge.
    unit: shipment
    aggregation: count
    dimensions:
      - carrier
      - service_class
      - origin
      - destination
  - name: postage_amount
    description: Pass-through postage / parcel cost charged by the carrier (USPS / UPS / FedEx
      etc.) on each shipment.
    unit: USD
    aggregation: sum
    dimensions:
      - carrier
      - service_class
  - name: tracking_event
    description: Tracking webhook events / poll responses; typically not separately billed.
    unit: event
    aggregation: count
    dimensions:
      - carrier
  - name: platform_subscription
    description: Negotiated monthly platform fee for the Shipping API merchant contract.
    unit: month
    aggregation: sum
    dimensions:
      - merchant
principles:
  - name: Visibility
    description: Track per-shipment cost via the Shipping API response (rate quote) and reconcile
      monthly against the Pitney Bowes invoice; pass-through postage dominates the line item.
  - name: Allocation
    description: Tag shipments with the originating store / fulfillment center / SKU so postage
      cost rolls up to the correct business unit.
  - name: Optimization
    description: Use rate-shopping to pick the cheapest carrier / service class per shipment;
      consolidate to negotiated zones; use Pitney Bowes presort / cubic discounts where they
      apply.
  - name: Accountability
    description: Logistics / fulfillment team owns shipment cost; finance reviews aggregate
      postage spend monthly versus volume.
maintainers:
