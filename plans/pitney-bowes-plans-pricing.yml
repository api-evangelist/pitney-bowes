specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Pitney Bowes
providerId: pitney-bowes
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Shipping
  - Mailing
  - Logistics
  - eCommerce
notes: Pitney Bowes runs a developer hub and offers Shipping APIs (parcel rating, label printing,
  manifest, tracking) but does not publish a self-service price book on the public developer site.
  Pricing is negotiated per merchant or carrier integration through Pitney Bowes Sendtech / Global
  Ecommerce sales. The single Contact Sales plan below reflects that gated commercial reality.
description: Pitney Bowes provides shipping and mailing technology, including Shipping APIs that
  cover rating, label generation, manifest creation, tracking, and address verification. The APIs
  are made available to merchants under negotiated commercial agreements; there is no published
  public price page.
sources:
  - https://www.pitneybowes.com/us/developer.html
  - https://docs.shippingapi.pitneybowes.com/api
plans:
  - id: pitney-bowes-shipping-api-merchant
    name: Shipping APIs - Merchant Contract
    type: enterprise
    description: Negotiated merchant contract for the Pitney Bowes Shipping APIs. Pricing varies by
      shipping volume, carrier mix, and any Pitney Bowes-issued postage / parcel services on the
      account.
    entries:
      - label: Merchant Contract
        name: merchant_contract
        type: flat
        metric: contract
        limit: -1
        timeFrame: usage
        geo: configurable
        unit: 1
        price: contact Pitney Bowes sales
        userMultiplied: false
      - label: Shipment Volume
        name: shipment_volume
        type: metered
        metric: shipment
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: 'varies by negotiated rate card'
        userMultiplied: false
    elements:
      - name: Shipping API (Rating / Labels / Manifest)
      - name: Tracking API
      - name: Address Validation API
      - name: Carrier Integrations (USPS / UPS / FedEx / etc.)
      - name: Negotiated Carrier Rates
maintainers:
