naftiko: 1.0.0-alpha2
info:
  label: Pitney Bowes Shipping API — Rating
  description: 'Pitney Bowes Shipping API — Rating. 1 operations. Lead operation: Rate a parcel. Self-contained Naftiko capability
    covering one Pitney Bowes business surface.'
  tags:
  - Pitney Bowes
  - Rating
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PITNEY_BOWES_API_KEY: PITNEY_BOWES_API_KEY
capability:
  consumes:
  - type: http
    namespace: pitney-bowes-rating
    baseUri: https://shipping-api.pitneybowes.com
    description: Pitney Bowes Shipping API — Rating business capability. Self-contained, no shared references.
    resources:
    - name: shippingservices-v1-rates
      path: /shippingservices/v1/rates
      operations:
      - name: rateparcel
        method: POST
        description: Rate a parcel
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PITNEY_BOWES_API_KEY}}'
  exposes:
  - type: rest
    namespace: pitney-bowes-rating-rest
    port: 8080
    description: REST adapter for Pitney Bowes Shipping API — Rating. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/shippingservices/v1/rates
      name: shippingservices-v1-rates
      description: REST surface for shippingservices-v1-rates.
      operations:
      - method: POST
        name: rateparcel
        description: Rate a parcel
        call: pitney-bowes-rating.rateparcel
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: pitney-bowes-rating-mcp
    port: 9090
    transport: http
    description: MCP adapter for Pitney Bowes Shipping API — Rating. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: rate-parcel
      description: Rate a parcel
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: pitney-bowes-rating.rateparcel
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
